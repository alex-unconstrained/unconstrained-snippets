<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="1800" height="1360"><rect width="900" height="680" fill="#FFFAF0"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#171C29"/></marker></defs><text x="450" y="38" text-anchor="middle" style="font-family:Staatliches,Impact,sans-serif;font-size:32px" fill="#171C29">THE RING</text><text x="450" y="62" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:16px" fill="#525D70">The trunk, cut through. Six movements make one growing cycle.</text><circle cx="450" cy="345" r="260" fill="#F9E9CF" stroke="#171C29" stroke-width="3"/><circle cx="450" cy="345" r="160" fill="#FFFEFB" stroke="#D7CEBF" stroke-width="2"/><circle cx="450" cy="345" r="115" fill="#F3ECDF" stroke="#D7CEBF" stroke-width="2"/><circle cx="450" cy="345" r="78" fill="#F5A623"/><line x1="610.0" y1="345.0" x2="710.0" y2="345.0" stroke="#F5A623" stroke-width="3"/><line x1="530.0" y1="483.6" x2="580.0" y2="570.2" stroke="#F5A623" stroke-width="3"/><line x1="370.0" y1="483.6" x2="320.0" y2="570.2" stroke="#F5A623" stroke-width="3"/><line x1="290.0" y1="345.0" x2="190.0" y2="345.0" stroke="#F5A623" stroke-width="3"/><line x1="370.0" y1="206.4" x2="320.0" y2="119.8" stroke="#F5A623" stroke-width="3"/><line x1="530.0" y1="206.4" x2="580.0" y2="119.8" stroke="#F5A623" stroke-width="3"/><text x="268.1" y="237.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Listen</text><text x="268.1" y="257.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">walk the orchard</text><text x="450.0" y="132.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Make meaning</text><text x="450.0" y="152.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">read the rings and soil</text><text x="631.9" y="237.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Choose</text><text x="631.9" y="257.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">pick the light</text><text x="621.9" y="431.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Build capacity</text><text x="621.9" y="451.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">feed the soil</text><text x="450.0" y="552.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Redesign</text><text x="450.0" y="572.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">graft a test branch</text><text x="278.1" y="431.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:19px;font-weight:700" fill="#171C29">Learn &amp; renew</text><text x="278.1" y="451.0" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:15px" fill="#525D70">read the new ring</text><text x="450" y="321" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:17px;font-weight:700" fill="#171C29">What do we</text><text x="450" y="340" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:17px;font-weight:700" fill="#171C29">choose to make</text><text x="450" y="359" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:17px;font-weight:700" fill="#171C29">possible, and</text><text x="450" y="378" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:17px;font-weight:700" fill="#171C29">for whom?</text><text x="354" y="350" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:14px;font-weight:700" fill="#525D70">1</text><text x="313" y="350" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:14px;font-weight:700" fill="#525D70">2</text><path d="M251.5 153.3 A276 276 0 0 1 383.2 77.2" fill="none" stroke="#171C29" stroke-width="2" marker-end="url(#ar)"/><text x="24" y="318" style="font-family:Staatliches,Impact,sans-serif;font-size:24px" fill="#171C29">BARK</text><text x="24" y="342" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">Listening</text><text x="24" y="366" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">continues</text><text x="24" y="390" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">throughout.</text><text x="728" y="300" style="font-family:Staatliches,Impact,sans-serif;font-size:24px" fill="#171C29">RINGS</text><text x="728" y="324" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">Each cycle leaves</text><text x="728" y="348" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">a ring. Read them</text><text x="728" y="372" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">to see what you</text><text x="728" y="396" style="font-family:Anaheim,Arial,sans-serif;font-size:17px" fill="#525D70">decided, and why.</text><text x="450" y="656" text-anchor="middle" style="font-family:Anaheim,Arial,sans-serif;font-size:16px" fill="#525D70">Clockwise from Listen. Return to any movement when experience or evidence changes the question.</text></svg>